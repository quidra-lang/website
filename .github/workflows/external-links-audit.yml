name: external-links-audit

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - .github/workflows/external-links-audit.yml

permissions:
  contents: read

jobs:
  audit:
    name: Verify released-site external URLs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build static site without regenerating benchmarks
        run: npm run build
      - name: Check all internal and external links
        run: node scripts/check-links.mjs dist --external
