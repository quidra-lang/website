name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: build and verify
    runs-on: ubuntu-latest
    env:
      QUIDRA_CORE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # Website and Core evolve together. main verifies against Core main;
      # develop verifies against Core develop; pull requests verify against the
      # branch they target. This prevents development syntax from being checked
      # with an older released compiler.
      - name: Build the matching Core compiler
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang llvm cmake ninja-build git libcurl4-openssl-dev
          git clone --depth 1 --branch "$QUIDRA_CORE_REF" https://github.com/quidra-lang/quidra "$RUNNER_TEMP/quidra"
          mkdir -p "$RUNNER_TEMP/quidra-packages"
          git clone --depth 1 --branch "$QUIDRA_CORE_REF" https://github.com/quidra-lang/math "$RUNNER_TEMP/quidra-packages/math"
          cmake -S "$RUNNER_TEMP/quidra" -B "$RUNNER_TEMP/quidra-build" -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/quidra-build" --parallel
          "$RUNNER_TEMP/quidra-build/quidra" --version
          echo "QUIDRA=$RUNNER_TEMP/quidra-build/quidra" >> "$GITHUB_ENV"
          echo "QUIDRA_PACKAGE_PATH=$RUNNER_TEMP/quidra-packages" >> "$GITHUB_ENV"
          echo "QUIDRA_NATIVE_INCLUDE_DIR=$RUNNER_TEMP/quidra/include" >> "$GITHUB_ENV"

      - name: Verify example programs
        run: bash scripts/check-examples.sh

      # Tokenize Website examples and the matching Core branch's own examples
      # with the same grammar contract.
      - name: Verify syntax grammar coverage
        run: QUIDRA_CORE_DIR="$RUNNER_TEMP/quidra" node scripts/check-grammar.mjs

      - name: Verify cross-repository copy contracts
        run: node scripts/check-cross-repo-contracts.mjs

      - name: Verify palette contrast
        run: node scripts/check-contrast.mjs

      - run: npm run check
      - run: npm run lint
      - run: npm run build

      - name: Verify internal links and fragments
        run: node scripts/check-links.mjs dist

      - uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: dist
          retention-days: 7
